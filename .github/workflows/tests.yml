name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Tkinter's C extension is not bundled with the standard Python
      # install on Ubuntu; python3-tk provides it. xvfb gives the GUI
      # smoke tests a real (virtual) display instead of skipping them.
      - name: Install Tk and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Run the test suite
        run: xvfb-run -a python -m unittest discover -s tests -v
