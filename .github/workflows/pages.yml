name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one deployment at a time; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # The site is index.html at the repo root; it reads the same
      # data/lessons and data/scenarios JSON the desktop app uses, so the
      # whole repo is uploaded rather than a separate build output.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
